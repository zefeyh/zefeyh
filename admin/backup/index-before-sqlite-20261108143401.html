    const iconMap = {
        'windows': 'fa fa-windows windows',
        'mac': 'fa fa-apple mac',
        'linux': 'fa fa-linux linux',
        'android': 'fa fa-android android',
        'fufei': 'fa fa-rmb fufei',
        'kexue': 'fa fa-ban kexue',
        'heart': 'fa fa-heart heart',
        'github': 'fa fa-github linux'
    };

    const state = { sites: [], categories: ['全部'], selected: '全部', keyword: '' };

    /* ---- 输出转义：杜绝数据中的 HTML/JS 注入 ---- */
    function esc(v) {
        return String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeHref(url) {
        const v = String(url == null ? '' : url).trim();
        return /^https?:\/\//i.test(v) ? esc(v) : '#';
    }
    function safeSrc(src) {
        const v = String(src == null ? '' : src).trim();
        if (/^https?:\/\//i.test(v)) return esc(v);
        if (/^(?:\.\/|\/)?[a-zA-Z0-9_\-\/.]+$/.test(v) && v.indexOf('..') === -1 && v.indexOf(':') === -1) return esc(v);
        return './ico/default.png';
    }

    function init() {
        state.sites = (Array.isArray(NAV_DATA.websites) ? NAV_DATA.websites : [])
            .filter(function (w) { return w && typeof w === 'object'; });

        const seen = Object.create(null);
        state.categories = ['全部'];
        (Array.isArray(NAV_DATA.categories) ? NAV_DATA.categories : []).forEach(function (c) {
            const name = String(c == null ? '' : c).trim();
            if (name && name !== '全部' && !seen[name]) { seen[name] = 1; state.categories.push(name); }
        });
        /* 兼容旧数据：出现但未登记的栏目自动补齐 */
        state.sites.forEach(function (w) {
            const name = String(w.category == null ? '' : w.category).trim();
            if (name && name !== '全部' && !seen[name]) { seen[name] = 1; state.categories.push(name); }
        });

        applyStoredTheme();
        renderSidebar();
        renderWebsites();
        bindGlobalEvents();
    }

    function applyStoredTheme() {
        let nightMode = false;
        try { nightMode = localStorage.getItem('nightMode') === 'true'; } catch (e) { /* 隐私模式 */ }
        const body = document.body;
        const toggleIcon = document.querySelector('#nightToggle i');
        if (nightMode) {
            body.classList.add('night-mode');
            if (toggleIcon) toggleIcon.className = 'fa fa-sun-o';
        } else {
            body.classList.remove('night-mode');
            if (toggleIcon) toggleIcon.className = 'fa fa-moon-o';
        }
    }

    function getCategoryCounts() {
        const counts = { '全部': state.sites.length };
        for (let i = 0; i < state.sites.length; i++) {
            const c = String(state.sites[i].category == null ? '' : state.sites[i].category);
            counts[c] = (counts[c] || 0) + 1;
        }
        return counts;
    }

    function renderSidebar() {
        const sidebar = document.getElementById('sidebarContainer');
        if (!sidebar) return;
        const counts = getCategoryCounts();
        const parts = [];
        for (let i = 0; i < state.categories.length; i++) {
            const cat = state.categories[i];
            parts.push('<div class="category-item' + (cat === state.selected ? ' active' : '') +
                '" data-category="' + esc(cat) + '">' + esc(cat) + ' (' + (counts[cat] || 0) + ')</div>');
        }
        sidebar.innerHTML = parts.join('');
    }

    /* 单个委托监听器，切换栏目时不再反复绑定事件 */
    function bindSidebar() {
        const sidebar = document.getElementById('sidebarContainer');
        if (!sidebar) return;
        sidebar.addEventListener('click', function (e) {
            const item = e.target.closest ? e.target.closest('.category-item') : null;
            if (item && sidebar.contains(item)) {
                e.stopPropagation();
                state.selected = item.dataset.category;
                sidebar.querySelectorAll('.category-item').forEach(function (el) {
                    el.classList.toggle('active', el === item);
                });
                const container = document.querySelector('.container');
                if (container && container.scrollTo) container.scrollTo({ top: 0, behavior: 'smooth' });
                renderWebsites();
                return;
            }
            if (e.target === sidebar) sidebar.classList.toggle('active');
        });
    }

    function bindGlobalEvents() {
        bindSidebar();

        /* 图标加载失败统一回退：避免内联 onerror，兼容严格 CSP */
        document.addEventListener('error', function (e) {
            const el = e.target;
            if (el && el.tagName === 'IMG' && el.dataset.fallback !== '1') {
                el.dataset.fallback = '1';
                el.src = './ico/default.png';
            }
        }, true);

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            let timer = 0;
            searchInput.addEventListener('input', function (e) {
                const value = e.target.value.toLowerCase();
                clearTimeout(timer);
                timer = setTimeout(function () { state.keyword = value; renderWebsites(); }, 90);
            });
        }

        document.addEventListener('click', function (e) {
            const sidebar = document.querySelector('.sidebar');
            if (sidebar && !sidebar.contains(e.target)) sidebar.classList.remove('active');
        }, { passive: true });

        new ExplanationBox('trigger', 'explanationBox');
        new ExplanationBox('trigger2', 'explanationBox2');

        const nightToggle = document.getElementById('nightToggle');
        if (nightToggle) {
            nightToggle.addEventListener('click', function () {
                const body = document.body;
                const icon = this.querySelector('i');
                body.classList.toggle('night-mode');
                const isNight = body.classList.contains('night-mode');
                if (icon) icon.className = isNight ? 'fa fa-sun-o' : 'fa fa-moon-o';
                try { localStorage.setItem('nightMode', isNight); } catch (e) { /* 隐私模式 */ }
            });
        }
    }

    function renderWebsites() {
        const container = document.getElementById('websitesContainer');
        if (!container) return;
        const kw = state.keyword;
        const parts = [];
        for (let i = 0; i < state.sites.length; i++) {
            const w = state.sites[i];
            if (state.selected !== '全部' && String(w.category == null ? '' : w.category) !== state.selected) continue;
            if (kw) {
                const hay = (String(w.name == null ? '' : w.name) + ' ' +
                             String(w.desc == null ? '' : w.desc) + ' ' +
                             String(w.url == null ? '' : w.url)).toLowerCase();
                if (hay.indexOf(kw) === -1) continue;
            }
            const remarks = Array.isArray(w.remark) ? w.remark : [];
            let icons = '';
            for (let j = 0; j < remarks.length; j++) {
                const cls = iconMap[String(remarks[j]).toLowerCase()] || '';
                if (cls) icons += '<i class="icon ' + cls + '"></i>';
            }
            parts.push(
                '<div class="item">' +
                    '<a href="' + safeHref(w.url) + '" target="_blank" rel="noopener noreferrer">' +
                        '<div class="siteico">' +
                            '<img src="' + safeSrc(w.logo) + '" alt="' + esc(w.name) + '" ' +
                                'loading="lazy" decoding="async" width="40" height="40">' +
                        '</div>' +
                        '<div class="site-info">' +
                            '<div class="sitetitle">' + esc(w.name || '未命名') + '</div>' +
                            '<div class="sitecontent">' + esc(w.desc || '') + '</div>' +
                        '</div>' +
                        '<div class="remark-icons">' + icons + '</div>' +
                    '</a>' +
                '</div>'
            );
        }
        container.innerHTML = parts.length ? parts.join('') :
            '<div class="empty-state">未找到相关网站</div>';
    }

    class ExplanationBox {
        constructor(triggerId, boxId) {
            this.trigger = document.getElementById(triggerId);
            this.box = document.getElementById(boxId);
            if (this.trigger && this.box) this.init();
        }
        init() {
            this.trigger.addEventListener('click', this.toggle.bind(this));
            document.addEventListener('click', this.checkOutsideClick.bind(this));
        }
        toggle(e) {
            e.stopPropagation();
            this.box.classList.toggle('show');
        }
        checkOutsideClick(e) {
            if (!this.trigger.contains(e.target) && !this.box.contains(e.target)) {
                this.box.classList.remove('show');
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
